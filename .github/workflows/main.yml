name: Docs Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1" # Weekly link check every Monday at 02:00 UTC
  workflow_dispatch:

jobs:
  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in content
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-all-private './content/**/*.md'
          fail: true

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check spelling with typos
        uses: crate-ci/typos@master
